services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Library@2026}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/library_all.sql:/docker-entrypoint-initdb.d/01-library.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -pLibrary@2026
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  mysql-data-repair:
    image: mysql:8.0
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-Library@2026}
    volumes:
      - ./repair-demo-data.sql:/repair/repair-demo-data.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - mysql --protocol=TCP -h mysql -uroot --default-character-set=utf8mb4 library_cloud < /repair/repair-demo-data.sql
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.4.0
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped

  auth-service:
    build:
      context: ..
      dockerfile: library-auth-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NACOS_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      mysql-data-repair:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  book-service:
    build:
      context: ..
      dockerfile: library-book-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NACOS_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  reader-service:
    build:
      context: ..
      dockerfile: library-reader-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NACOS_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  circulation-service:
    build:
      context: ..
      dockerfile: library-circulation-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NACOS_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  system-service:
    build:
      context: ..
      dockerfile: library-system-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NACOS_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  statistics-service:
    build:
      context: ..
      dockerfile: library-statistics-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NACOS_ADDR: nacos:8848
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  gateway:
    build:
      context: ..
      dockerfile: library-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_ADDR: nacos:8848
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_started
      auth-service:
        condition: service_started
      book-service:
        condition: service_started
      reader-service:
        condition: service_started
      circulation-service:
        condition: service_started
      system-service:
        condition: service_started
      statistics-service:
        condition: service_started
    restart: on-failure

  web:
    build:
      context: ../library-web
    ports:
      - "8088:80"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data: